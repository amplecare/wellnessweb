<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Abstract illustration of a supported care team">
  <defs>
    <linearGradient id="sup-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#110d24"/>
      <stop offset="55%" stop-color="#050411"/>
      <stop offset="100%" stop-color="#044E3E"/>
    </linearGradient>
    <linearGradient id="sup-arc-a" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fe9c1" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6fe9c1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sup-arc-b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfb0ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#bfb0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sup-glow" cx="0.3" cy="0.26" r="0.75">
      <stop offset="0%" stop-color="#dad2ff" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#dad2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sup-bg)"/>
  <rect width="800" height="600" fill="url(#sup-glow)"/>

  <!-- Sheltering arc reading as cover and support over the group below. -->
  <path d="M96 470 A 304 304 0 0 1 704 470" fill="none" stroke="url(#sup-arc-a)" stroke-width="30" stroke-linecap="round"/>
  <path d="M168 470 A 232 232 0 0 1 632 470" fill="none" stroke="#02a074" stroke-opacity="0.5" stroke-width="12" stroke-linecap="round"/>
  <path d="M-30 148 C 170 44 300 232 840 96" fill="none" stroke="url(#sup-arc-b)" stroke-width="22"/>

  <!-- Abstracted figures: rounded forms, no faces, no fabricated likeness. -->
  <g>
    <circle cx="400" cy="300" r="46" fill="#6fe9c1"/>
    <path d="M330 470 a70 84 0 0 1 140 0 z" fill="#6fe9c1"/>

    <circle cx="276" cy="342" r="35" fill="#bfb0ff" fill-opacity="0.95"/>
    <path d="M222 470 a54 66 0 0 1 108 0 z" fill="#bfb0ff" fill-opacity="0.95"/>

    <circle cx="524" cy="342" r="35" fill="#bfb0ff" fill-opacity="0.95"/>
    <path d="M470 470 a54 66 0 0 1 108 0 z" fill="#bfb0ff" fill-opacity="0.95"/>

    <circle cx="176" cy="386" r="27" fill="#a184ff" fill-opacity="0.8"/>
    <path d="M134 470 a42 52 0 0 1 84 0 z" fill="#a184ff" fill-opacity="0.8"/>

    <circle cx="624" cy="386" r="27" fill="#a184ff" fill-opacity="0.8"/>
    <path d="M582 470 a42 52 0 0 1 84 0 z" fill="#a184ff" fill-opacity="0.8"/>
  </g>

  <!-- Ground line -->
  <rect x="96" y="468" width="608" height="3" rx="1.5" fill="#ffffff" fill-opacity="0.24"/>

  <circle cx="678" cy="150" r="60" fill="#02a074" fill-opacity="0.2"/>
  <circle cx="122" cy="112" r="38" fill="#a184ff" fill-opacity="0.24"/>
</svg>
