<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Ample Care video poster">
  <defs>
    <linearGradient id="vp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#240f5c"/>
      <stop offset="52%" stop-color="#050411"/>
      <stop offset="100%" stop-color="#044E3E"/>
    </linearGradient>
    <linearGradient id="vp-arc-a" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#6fe9c1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6fe9c1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vp-arc-b" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfb0ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bfb0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vp-glow" cx="0.5" cy="0.46" r="0.6">
      <stop offset="0%" stop-color="#dad2ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#dad2ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="vp-dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#vp-bg)"/>
  <rect width="1600" height="900" fill="url(#vp-dots)"/>
  <rect width="1600" height="900" fill="url(#vp-glow)"/>

  <path d="M-80 760 C 300 520 520 820 1700 380" fill="none" stroke="url(#vp-arc-a)" stroke-width="150"/>
  <path d="M-60 250 C 340 40 700 470 1700 120" fill="none" stroke="url(#vp-arc-b)" stroke-width="90"/>

  <circle cx="1300" cy="690" r="230" fill="#02a074" fill-opacity="0.16"/>
  <circle cx="250" cy="200" r="150" fill="#a184ff" fill-opacity="0.18"/>
</svg>
